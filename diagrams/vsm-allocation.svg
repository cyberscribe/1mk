<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif">
  <title>Allocation of the viable-system levels between AI and human in One-Man Kanban</title>

  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- human-only zone tint (above the accountability boundary) -->
  <rect x="80" y="150" width="1760" height="166" fill="#F6EFE9"/>

  <!-- column headers -->
  <g fill="#8A8A8A" font-size="21" letter-spacing="2.6">
    <text x="80" y="112">SYSTEM</text>
    <text x="580" y="112">AI</text>
    <text x="910" y="112">HUMAN</text>
    <text x="1370" y="112">FAILURE MODE</text>
  </g>
  <line x1="80" y1="130" x2="1840" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ============ S5 ============ -->
  <g>
    <text x="80" y="204" font-size="31" font-weight="700" fill="#1A1A1A">System 5 <tspan fill="#8A8A8A" font-weight="400">·</tspan> Identity</text>
    <text x="80" y="240" font-size="20" fill="#7A7068">Outcomes · principles · what you answer for</text>

    <g>
      <rect x="580" y="186" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <rect x="614" y="186" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <rect x="648" y="186" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <rect x="682" y="186" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <text x="580" y="234" font-size="23" font-weight="700" fill="#9A9A9A">none</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="910" y="200">Decides what the work is for.</text>
      <text x="910" y="231">Arbitrates present against future.</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="1370" y="200"><tspan font-weight="700" fill="#A8532A">Cognitive Servitude</tspan> — the</text>
      <text x="1370" y="231">instrument that detects divergence</text>
      <text x="1370" y="262">becomes the one that arbitrates it.</text>
    </g>
  </g>

  <!-- accountability boundary -->
  <text x="1840" y="300" text-anchor="end" font-size="17" letter-spacing="2.4" fill="#A8532A">ACCOUNTABILITY BOUNDARY</text>
  <line x1="80" y1="316" x2="1840" y2="316" stroke="#A8532A" stroke-width="3"/>

  <!-- ============ S4 ============ -->
  <g>
    <text x="80" y="370" font-size="31" font-weight="700" fill="#1A1A1A">System 4 <tspan fill="#8A8A8A" font-weight="400">·</tspan> Adaptation</text>
    <text x="80" y="406" font-size="20" fill="#7A7068">Monthly gap-spotting · Ideas · Backlog</text>

    <g>
      <rect x="580" y="352" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="614" y="352" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="648" y="352" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <rect x="682" y="352" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <text x="580" y="400" font-size="23" font-weight="700" fill="#1F6F8B">informs</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="910" y="366">Chooses which signals count.</text>
      <text x="910" y="397">Sets what is scanned for.</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="1370" y="366"><tspan font-weight="700" fill="#A8532A">Cognitive Dependence</tspan> — futures</text>
      <text x="1370" y="397">accepted whole and unread.</text>
    </g>
  </g>
  <line x1="80" y1="482" x2="1840" y2="482" stroke="#E4E4E4" stroke-width="1"/>

  <!-- ============ S3 ============ -->
  <g>
    <text x="80" y="536" font-size="31" font-weight="700" fill="#1A1A1A">System 3 <tspan fill="#8A8A8A" font-weight="400">·</tspan> Control</text>
    <text x="80" y="572" font-size="20" fill="#7A7068">Daily briefing · Weekly retrospective</text>

    <g>
      <rect x="580" y="518" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="614" y="518" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="648" y="518" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="682" y="518" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <text x="580" y="566" font-size="23" font-weight="700" fill="#1F6F8B">assists</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="910" y="532">Judges trade-offs. Lets the runway</text>
      <text x="910" y="563">challenge the horizons.</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="1370" y="532">Review reports compliance</text>
      <text x="1370" y="563">where it should mount challenge.</text>
    </g>
  </g>
  <line x1="80" y1="648" x2="1840" y2="648" stroke="#E4E4E4" stroke-width="1"/>

  <!-- ============ S2 ============ -->
  <g>
    <text x="80" y="702" font-size="31" font-weight="700" fill="#1A1A1A">System 2 <tspan fill="#8A8A8A" font-weight="400">·</tspan> Anti-oscillation</text>
    <text x="80" y="738" font-size="20" fill="#7A7068">Working memory · calendar · board columns</text>

    <g>
      <rect x="580" y="684" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="614" y="684" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="648" y="684" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="682" y="684" width="26" height="10" rx="5" fill="#DEDEDE"/>
      <text x="580" y="732" font-size="23" font-weight="700" fill="#1F6F8B">assists</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="910" y="698">Holds working memory unshared.</text>
      <text x="910" y="729">Sequences own attention.</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="1370" y="698">Parallel loops contend for the</text>
      <text x="1370" y="729">same context; attention fragments.</text>
    </g>
  </g>
  <line x1="80" y1="814" x2="1840" y2="814" stroke="#E4E4E4" stroke-width="1"/>

  <!-- ============ S1 ============ -->
  <g>
    <text x="80" y="868" font-size="31" font-weight="700" fill="#1A1A1A">System 1 <tspan fill="#8A8A8A" font-weight="400">·</tspan> Operations</text>
    <text x="80" y="904" font-size="20" fill="#7A7068">Agentic loops · deliverables</text>

    <g>
      <rect x="580" y="850" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="614" y="850" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="648" y="850" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <rect x="682" y="850" width="26" height="10" rx="5" fill="#1F6F8B"/>
      <text x="580" y="898" font-size="23" font-weight="700" fill="#1F6F8B">occupies</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="910" y="864">Defines deliverables and</text>
      <text x="910" y="895">acceptance criteria. Reviews</text>
      <text x="910" y="926">before entry.</text>
    </g>

    <g font-size="21" fill="#1A1A1A">
      <text x="1370" y="864"><tspan font-weight="700" fill="#A8532A">Cognitive Debt</tspan> — unreviewed</text>
      <text x="1370" y="895">deliverables inside the perimeter.</text>
    </g>
  </g>
  <line x1="80" y1="980" x2="1840" y2="980" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
